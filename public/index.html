
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Plug</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#101a30,#253c60);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 390px;
  background: #192943;
  padding: 30px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 15px 40px #0005;
}

h1 { margin: 0 0 8px; font-size: 30px; }
.subtitle { color: #aabbd4; font-size: 14px; }

.plug {
  width: 145px;
  height: 155px;
  margin: 30px auto 20px;
  background: #dce5f1;
  border-radius: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 10px 25px #0005;
}

.socket {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: #35445d;
  position: relative;
}

.socket:before, .socket:after {
  content: "";
  position: absolute;
  top: 25px;
  width: 9px;
  height: 25px;
  border-radius: 8px;
  background: #111827;
}

.socket:before { left: 23px; }
.socket:after { right: 23px; }

#lamp {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  display: inline-block;
  background: #718096;
  margin-right: 8px;
}

#lamp.on {
  background: #36e58b;
  box-shadow: 0 0 15px #36e58b;
}

.status {
  font-size: 19px;
  font-weight: bold;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

button {
  flex: 1;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}

#onBtn { background: #16a34a; }
#offBtn { background: #dc3545; }

button:disabled {
  opacity: .5;
  cursor: wait;
}

.connection {
  margin-top: 25px;
  color: #aabbd4;
  font-size: 13px;
}

</style>
</head>

<body>
<div class="container">

  <h1>SMART PLUG</h1>
  <div class="subtitle">ระบบควบคุมปลั๊กไฟอัจฉริยะ</div>

  <div class="plug">
    <div class="socket"></div>
  </div>

  <div class="status">
    <span id="lamp"></span>
    <span id="stateText">กำลังเชื่อมต่อ...</span>
  </div>

  <div class="buttons">
    <button id="onBtn" onclick="setSwitch(true)">ON</button>
    <button id="offBtn" onclick="setSwitch(false)">OFF</button>
  </div>

  <div class="connection" id="connection">
    กำลังตรวจสอบระบบ...
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let busy = false;

async function refresh() {
  try {
    const response = await fetch("/api/state", {
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    const data = await response.json();
    const relay = data.channels[0];

    $("lamp").classList.toggle("on", relay.on);

    $("stateText").textContent =
      relay.on ? "เปิดอยู่" : "ปิดอยู่";

    $("connection").textContent =
      "Server ออนไลน์ | Relay 1";

  } catch (error) {
    $("stateText").textContent = "ไม่สามารถอ่านสถานะได้";
    $("connection").textContent = "Server ไม่ออนไลน์";
  }
}

async function setSwitch(on) {
  if (busy) return;

  busy = true;
  $("onBtn").disabled = true;
  $("offBtn").disabled = true;

  try {
    const response = await fetch("/api/switch", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        channel: 1,
        on: on,
        minutes: 0
      })
    });

    if (!response.ok) throw new Error();

    await refresh();

  } catch (error) {
    $("connection").textContent = "ส่งคำสั่งไม่สำเร็จ";
  }

  busy = false;
  $("onBtn").disabled = false;
  $("offBtn").disabled = false;
}

refresh();
setInterval(refresh, 2000);
</script>

</body>
</html>
